spring:
  application:
  name: usermanagement

  datasource:
    url: jdbc:h2:mem:usermanagement
    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8090

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}