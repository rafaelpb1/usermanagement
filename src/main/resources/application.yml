    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 150080235249-4eothsn3j8b6an8bhqtr9lqoj5bklj75.apps.googleusercontent.com
            client-secret: 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

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8090

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}

springdoc:
  override-with-generic-response-false: false

logging:
